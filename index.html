<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पंचायत Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#e2e8f0;
padding:20px;
}

.topbar{
background:linear-gradient(45deg,#166534,#22c55e);
padding:20px;
border-radius:20px;
color:white;
text-align:center;
font-size:34px;
font-weight:700;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.sub{
margin-top:10px;
font-size:18px;
font-weight:400;
}

.stats{
display:flex;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.card{
flex:1;
min-width:220px;
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
border-top:7px solid #16a34a;
}

.cardNumber{
font-size:45px;
font-weight:700;
color:#166534;
}

.cardText{
margin-top:10px;
font-size:20px;
color:#475569;
}

.sectionTitle{
margin-top:40px;
font-size:35px;
font-weight:700;
color:#166534;
}

.problemList{
margin-top:25px;
display:flex;
flex-direction:column;
gap:25px;
}

.problemBox{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
border-left:8px solid #16a34a;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.problemTitle{
font-size:28px;
font-weight:700;
color:#166534;
}

.problemText{
margin-top:15px;
font-size:22px;
line-height:1.8;
color:#334155;
background:#f8fafc;
padding:18px;
border-radius:15px;
}

.time{
margin-top:18px;
font-size:18px;
color:#64748b;
}

.device{
margin-top:10px;
font-size:16px;
color:#94a3b8;
word-break:break-all;
}

.images{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:20px;
}

.images img{
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
border:4px solid #16a34a;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.shareBox{
margin-top:50px;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.shareTitle{
font-size:32px;
font-weight:700;
color:#166534;
}

.shareItem{
margin-top:20px;
padding:18px;
background:#f8fafc;
border-radius:15px;
font-size:20px;
color:#334155;
}

.loading{
margin-top:40px;
text-align:center;
font-size:28px;
font-weight:700;
color:#166534;
}

@media(max-width:768px){

.topbar{
font-size:24px;
}

.problemTitle{
font-size:22px;
}

.problemText{
font-size:18px;
}

.images img{
width:100%;
height:auto;
}

.cardNumber{
font-size:35px;
}

.sectionTitle{
font-size:28px;
}

}

</style>
</head>

<body>

<div class="topbar">
🇮🇳 पंचायत Admin Dashboard

<div class="sub">
खैरा भूधर पंचायत डिजिटल शिकायत प्रबंधन
</div>

</div>

<div class="stats">

<div class="card">
<div class="cardNumber" id="totalProblems">0</div>
<div class="cardText">
कुल शिकायत
</div>
</div>

<div class="card">
<div class="cardNumber" id="totalShares">0</div>
<div class="cardText">
WhatsApp Share
</div>
</div>

<div class="card">
<div class="cardNumber">24×7</div>
<div class="cardText">
ऑनलाइन सेवा
</div>
</div>

</div>

<div class="sectionTitle">
📋 पंचायत की सभी शिकायतें
</div>

<div class="problemList" id="problemList">

<div class="loading">
लोड हो रहा है...
</div>

</div>

<div class="shareBox">

<div class="shareTitle">
📲 WhatsApp Share Details
</div>

<div id="shareList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyAtDYiT56i1_-wQSLY7f9coeFIDno8mNzA",

authDomain: "booking-enformation.firebaseapp.com",

databaseURL: "https://booking-enformation-default-rtdb.firebaseio.com",

projectId: "booking-enformation",

storageBucket: "booking-enformation.firebasestorage.app",

messagingSenderId: "79751368635",

appId: "1:79751368635:web:24816311826fae2a41be9e",

measurementId: "G-0WFGCM99NF"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// LOAD PROBLEMS

const problemList = document.getElementById("problemList");

const totalProblems = document.getElementById("totalProblems");

onValue(ref(db,"panchayatProblems"),(snapshot)=>{

problemList.innerHTML = "";

let count = 0;

snapshot.forEach((child)=>{

count++;

const data = child.val();

let imagesHTML = "";

if(data.images){

data.images.forEach(img=>{

imagesHTML += `
<img src="${img}">
`;

});

}

problemList.innerHTML = `

<div class="problemBox">

<div class="problemTitle">
📝 नई शिकायत
</div>

<div class="problemText">
${data.problem}
</div>

<div class="time">
🕒 ${data.time}
</div>

<div class="device">
📱 ${data.device}
</div>

<div class="images">
${imagesHTML}
</div>

</div>

` + problemList.innerHTML;

});

totalProblems.innerText = count;

});


// LOAD SHARE DETAILS

const shareList = document.getElementById("shareList");

const totalShares = document.getElementById("totalShares");

onValue(ref(db,"whatsappShares"),(snapshot)=>{

shareList.innerHTML = "";

let shareCount = 0;

snapshot.forEach((child)=>{

shareCount++;

const data = child.val();

shareList.innerHTML = `

<div class="shareItem">

🕒 ${data.time}
<br><br>

📱 ${data.device}

</div>

` + shareList.innerHTML;

});

totalShares.innerText = shareCount;

});

</script>

</body>
</html>
